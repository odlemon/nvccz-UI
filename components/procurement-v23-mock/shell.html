<div class="app" id="app">
 <aside class="sidebar">
  <div class="brand"><img id="brandLogo" alt="Matanho"><span class="brand-letter">m</span></div>
  <nav class="nav-scroll" id="nav"></nav>
  <div class="collapse-wrap"><button class="collapse-btn" data-action="toggle-sidebar" aria-label="Expand or collapse menu"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg><span class="collapse-text">Collapse menu</span></button></div>
 </aside>
 <section class="shell">
   <header class="topbar">
    <button class="search" data-action="search"><span>Search plans, requisitions, tenders, vendors, POs and documents…</span></button>
    <div class="spacer"></div>
    <select class="selector entity" id="entitySelect"></select>
    <select class="selector" id="yearSelect"><option>FY 2026</option><option>FY 2025</option><option>FY 2024</option></select>
    <button class="icon-btn apps-launcher-btn" data-action="apps-launcher" aria-label="Open Matanho applications" title="Matanho applications"></button>
    <button class="icon-btn" data-action="toggle-theme" aria-label="Toggle theme" onclick="this.closest('#app').dataset.theme = this.closest('#app').dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = this.closest('#app').dataset.theme;"><span data-icon="sun"></span></button>
    <button class="icon-btn" data-action="notifications" aria-label="Notifications"></button>
    <div class="avatar">AM</div><div class="user-name"><strong>Nyasha Moyo</strong><br><span style="font-size:11px;color:var(--muted)">Group Procurement Lead</span></div>
   </header>
  <main class="content" id="workspace"></main>
 </section>
</div>
<div class="drawer-layer" id="drawerLayer" aria-hidden="true"><div class="overlay" data-action="close-overlay"></div><aside class="drawer"><div class="drawer-head"><div><h2 id="drawerTitle"></h2><p id="drawerSub"></p></div><button class="icon-btn" data-action="close-overlay">×</button></div><div class="drawer-body" id="drawerBody"></div><div class="drawer-foot" id="drawerFoot"></div></aside></div>
<div class="modal-layer" id="modalLayer" aria-hidden="true"><div class="overlay" data-action="close-overlay"></div><section class="modal"><div class="modal-head"><div><h2 id="modalTitle"></h2><p id="modalSub"></p></div><button class="icon-btn" data-action="close-overlay">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></section></div>
<div id="activityRoot"></div><div class="toast-stack" id="toasts"></div>
