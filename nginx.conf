events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=10s;

    # HTTP to HTTPS redirect for procurement.matanho.com
    server {
        listen 80;
        server_name procurement.matanho.com;

        # Let's Encrypt ACME challenge - serve directly from webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTP to HTTPS redirect for fardarc.my.prochanic.com
    server {
        listen 80;
        server_name fardarc.my.prochanic.com;

        # Let's Encrypt ACME challenge - serve directly from webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server for procurement.matanho.com
    server {
        listen 443 ssl http2;
        server_name procurement.matanho.com;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/procurement.matanho.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/procurement.matanho.com/privkey.pem;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;

        # Main location - use variable for runtime DNS resolution
        location / {
            set $upstream http://procurement:3000;
            proxy_pass $upstream;
        }

        # Next.js static files
        location /_next/static/ {
            set $upstream http://procurement:3000;
            proxy_pass $upstream;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js image optimization (if enabled)
        location /_next/image/ {
            set $upstream http://procurement:3000;
            proxy_pass $upstream;
        }

        # Health check endpoint
        location /health {
            set $upstream http://procurement:3000;
            proxy_pass $upstream;
            access_log off;
        }
    }

    # HTTPS server for fardarc.my.prochanic.com
    server {
        listen 443 ssl http2;
        server_name fardarc.my.prochanic.com;

        # SSL Configuration - use fardarc's own certificate from host mount
        ssl_certificate /etc/letsencrypt-host/live/fardarc.my.prochanic.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt-host/live/fardarc.my.prochanic.com/privkey.pem;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy to fardarc's backend (adjust as needed)
        # For now, return a maintenance page or proxy to its actual backend
        location / {
            return 200 'fardarc.my.prochanic.com is served by a different service';
            add_header Content-Type text/plain;
        }
    }
}