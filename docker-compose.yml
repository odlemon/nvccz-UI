version: '3.8'

services:
  procurement:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procurement-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - procurement-network

  nginx:
    image: nginx:alpine
    container_name: procurement-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt-host:ro
    depends_on:
      - procurement
    networks:
      - procurement-network

networks:
  procurement-network:
    driver: bridge