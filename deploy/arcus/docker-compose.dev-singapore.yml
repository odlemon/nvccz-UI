# Arcus Dev replica on the shared Singapore server (207.180.234.151).
#
# Same services, database name (arcus_dev), build args and Matanho branding as deploy/arcus/docker-compose.dev.yml (the dev
# stack that ran on the NTS server behind Traefik). The host here already runs nginx on 80/443 for other projects, so there is
# no edge proxy in this stack: every container publishes to 127.0.0.1 only and the host nginx routes the dev.matanho.com
# hostnames in (generated by scripts/deploy-arcus-dev-singapore-docker.py). Memory is capped per container because the host is
# shared.
name: arcus-dev

x-ui: &ui
  restart: unless-stopped
  depends_on:
    - api
  mem_limit: 640m
  environment:
    NODE_ENV: production
    PORT: "3000"

x-ui-args: &ui-args
  NODE_HEAP_MB: ${NODE_HEAP_MB:-3072}
  NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
  NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 1g
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M --performance-schema=OFF --max-connections=150
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: arcus_dev
      MYSQL_USER: arcus_dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - arcus_dev_mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3317:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  upload:
    build:
      context: ../upload-service
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: "3050"
      UPLOAD_ROOT: /data/uploads
    volumes:
      - arcus_dev_upload:/data/uploads
    # Reached by the API over the compose network only (the host's own port 3050 belongs to another project).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3050/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../src/api
      dockerfile: Dockerfile
      args:
        NODE_HEAP_MB: ${API_NODE_HEAP_MB:-6144}
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      mysql:
        condition: service_healthy
      upload:
        condition: service_healthy
    ports:
      - "127.0.0.1:3319:3009"
    env_file:
      - ../secrets/dev.env
    environment:
      NODE_ENV: production
      PORT: "3009"
      DB_HOST: mysql
      DB_PORT: "3306"
      DATABASE_URL: mysql://arcus_dev:${MYSQL_PASSWORD}@mysql:3306/arcus_dev
      RUN_SEED: "1"
      REMOTE_UPLOAD_SERVICE_URL: http://upload:3050/upload
      REMOTE_MEDIA_INTERNAL_BASE: http://upload:3050/uploads
    volumes:
      - arcus_dev_api_storage:/app/storage/local-upload-mock

  ui-staff:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: staff
        NEXT_PUBLIC_LP_PORTAL_URL: ${PUBLIC_LP_PORTAL_URL}
        NEXT_PUBLIC_INVESTEE_PORTAL_URL: ${PUBLIC_INVESTEE_PORTAL_URL}
        NEXT_PUBLIC_APPLY_PORTAL_URL: ${PUBLIC_APPLY_PORTAL_URL}
        NEXT_PUBLIC_VENDOR_PORTAL_URL: ${PUBLIC_VENDOR_PORTAL_URL}
        NEXT_PUBLIC_EVENTS_PORTAL_URL: ${PUBLIC_EVENTS_PORTAL_URL}
    ports:
      - "127.0.0.1:3310:3000"

  ui-lp:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: lp
    ports:
      - "127.0.0.1:3311:3000"

  ui-investee:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: investee
    ports:
      - "127.0.0.1:3312:3000"

  ui-apply:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: apply
    ports:
      - "127.0.0.1:3313:3000"

  ui-vendor:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: vendor
    ports:
      - "127.0.0.1:3314:3000"

  ui-events:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: events
    ports:
      - "127.0.0.1:3315:3000"

volumes:
  arcus_dev_mysql:
  arcus_dev_api_storage:
  arcus_dev_upload:
