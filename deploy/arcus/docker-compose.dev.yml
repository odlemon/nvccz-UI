name: arcus-dev

networks:
  edge:
    external: true
    name: lms_lms-network

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: arcus_dev
      MYSQL_USER: arcus_dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - arcus_dev_mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  api:
    build:
      context: ../src/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - edge
    env_file:
      - ../secrets/dev.env
    environment:
      NODE_ENV: production
      PORT: "3009"
      DB_HOST: mysql
      DB_PORT: "3306"
      DATABASE_URL: mysql://arcus_dev:${MYSQL_PASSWORD}@mysql:3306/arcus_dev
      RUN_SEED: "1"
    volumes:
      - arcus_dev_api_storage:/app/storage/local-upload-mock
    labels:
      - traefik.enable=true
      - traefik.docker.network=lms_lms-network
      - traefik.http.routers.arcus-dev-api.rule=Host(`dev-api.arcus.co.zw`)
      - traefik.http.routers.arcus-dev-api.entrypoints=websecure
      - traefik.http.routers.arcus-dev-api.tls.certresolver=le
      - traefik.http.services.arcus-dev-api.loadbalancer.server.port=3009

  ui:
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - edge
    environment:
      NODE_ENV: production
      PORT: "3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=lms_lms-network
      - traefik.http.routers.arcus-dev-ui.rule=Host(`dev.arcus.co.zw`)
      - traefik.http.routers.arcus-dev-ui.entrypoints=websecure
      - traefik.http.routers.arcus-dev-ui.tls.certresolver=le
      - traefik.http.services.arcus-dev-ui.loadbalancer.server.port=3000

volumes:
  arcus_dev_mysql:
  arcus_dev_api_storage:
