# NVCCZ on the shared Singapore server (207.180.234.151).
#
# The host already runs nginx on 80/443 for other projects, so this stack has no edge proxy of its own: every
# container publishes to 127.0.0.1 only and the host nginx (deploy/nvccz/nginx-nvccz.conf) routes the hostnames in.
# Memory is capped per container because the host is shared and has no swap headroom to spare.
name: nvccz-sg

x-ui: &ui
  restart: unless-stopped
  depends_on:
    - api
  mem_limit: 640m
  environment:
    NODE_ENV: production
    PORT: "3000"

x-ui-build-args: &ui-args
  NODE_HEAP_MB: ${NODE_HEAP_MB:-3072}
  NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
  NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}
  NEXT_PUBLIC_ORGANIZATION_NAME: ${NEXT_PUBLIC_ORGANIZATION_NAME}
  NEXT_PUBLIC_ORGANIZATION_LOGO: ${NEXT_PUBLIC_ORGANIZATION_LOGO}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 1g
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M --performance-schema=OFF --max-connections=120
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nvccz_prod
      MYSQL_USER: nvccz_prod
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - nvccz_sg_mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3327:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  upload:
    build:
      context: ../upload-service
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: "3050"
      UPLOAD_ROOT: /data/uploads
    volumes:
      - nvccz_sg_upload:/data/uploads
    ports:
      - "127.0.0.1:3250:3050"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3050/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../src/api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      mysql:
        condition: service_healthy
      upload:
        condition: service_healthy
    ports:
      - "127.0.0.1:3209:3009"
    env_file:
      - ../secrets/prod.env
    environment:
      NODE_ENV: production
      PORT: "3009"
      DB_HOST: mysql
      DB_PORT: "3306"
      DATABASE_URL: mysql://nvccz_prod:${MYSQL_PASSWORD}@mysql:3306/nvccz_prod
      RUN_SEED: "1"
      REMOTE_UPLOAD_SERVICE_URL: http://upload:3050/upload
      REMOTE_MEDIA_INTERNAL_BASE: http://upload:3050/uploads
    volumes:
      - nvccz_sg_upload:/app/storage/local-upload-mock

  ui-staff:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: staff
        NEXT_PUBLIC_LP_PORTAL_URL: ${PUBLIC_LP_PORTAL_URL}
        NEXT_PUBLIC_INVESTEE_PORTAL_URL: ${PUBLIC_INVESTEE_PORTAL_URL}
        NEXT_PUBLIC_APPLY_PORTAL_URL: ${PUBLIC_APPLY_PORTAL_URL}
        NEXT_PUBLIC_VENDOR_PORTAL_URL: ${PUBLIC_VENDOR_PORTAL_URL}
        NEXT_PUBLIC_EVENTS_PORTAL_URL: ${PUBLIC_EVENTS_PORTAL_URL}
        NEXT_PUBLIC_AUTH_TOKEN_KEY: nvccz_staff_token
        NEXT_PUBLIC_AUTH_USER_KEY: nvccz_staff_user
        NEXT_PUBLIC_AUTH_PROFILE_KEY: nvccz_staff_profile
    ports:
      - "127.0.0.1:3200:3000"

  ui-lp:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: lp
        NEXT_PUBLIC_AUTH_TOKEN_KEY: nvccz_lp_token
        NEXT_PUBLIC_AUTH_USER_KEY: nvccz_lp_user
        NEXT_PUBLIC_AUTH_PROFILE_KEY: nvccz_lp_profile
    ports:
      - "127.0.0.1:3210:3000"

  ui-investee:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: investee
        NEXT_PUBLIC_AUTH_TOKEN_KEY: nvccz_investee_token
        NEXT_PUBLIC_AUTH_USER_KEY: nvccz_investee_user
        NEXT_PUBLIC_AUTH_PROFILE_KEY: nvccz_investee_profile
    ports:
      - "127.0.0.1:3220:3000"

  ui-apply:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: apply
    ports:
      - "127.0.0.1:3230:3000"

  ui-vendor:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: vendor
        NEXT_PUBLIC_AUTH_TOKEN_KEY: nvccz_vendor_token
        NEXT_PUBLIC_AUTH_USER_KEY: nvccz_vendor_user
        NEXT_PUBLIC_AUTH_PROFILE_KEY: nvccz_vendor_profile
    ports:
      - "127.0.0.1:3240:3000"

  ui-events:
    <<: *ui
    build:
      context: ../src/ui
      dockerfile: Dockerfile
      args:
        <<: *ui-args
        NEXT_PUBLIC_PORTAL: events
        NEXT_PUBLIC_AUTH_TOKEN_KEY: nvccz_events_token
        NEXT_PUBLIC_AUTH_USER_KEY: nvccz_events_user
        NEXT_PUBLIC_AUTH_PROFILE_KEY: nvccz_events_profile
    ports:
      - "127.0.0.1:3260:3000"

volumes:
  nvccz_sg_mysql:
  nvccz_sg_upload:
