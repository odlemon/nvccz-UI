# NVCCZ virtual hosts for the shared Singapore server (207.180.234.151), installed as
# /etc/nginx/sites-available/nvccz and linked into sites-enabled. Plain HTTP only: `certbot --nginx` adds the
# listen 443 ssl blocks, certificates and the HTTP->HTTPS redirect per hostname once DNS points at this server.
#
# One upstream per portal container (published on 127.0.0.1 by docker-compose.singapore.yml).

# Own variable name so this file cannot collide with a `map` another project already declared.
map $http_upgrade $nvccz_connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- API (also serves socket.io and uploaded media) -------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.nvccz.online;

    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:3209;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # socket.io polls first, then upgrades to a WebSocket on this same host.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nvccz_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- Portals ----------------------------------------------------------------------------------------------
# Apply (public funding form) — nvccz.online, www redirects to it.
server {
    listen 80;
    listen [::]:80;
    server_name www.nvccz.online;
    return 301 http://nvccz.online$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nvccz.online;
    client_max_body_size 80m;
    location / {
        proxy_pass http://127.0.0.1:3230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nvccz_connection_upgrade;
        proxy_read_timeout 120s;
    }
}

